appId: br.com.lojatabacaria.setup
productName: NossoSistema
directories:
  output: dist-setup
files:
  - out/setup-launcher/**/*
  - package.json
extraResources:
  - from: dist-final/win-unpacked
    to: embedded/app
  - from: build/autoupdate/node.exe
    to: autoupdate/node.exe
  - from: out/autoupdate/autoupdate.js
    to: autoupdate/autoupdate.js
  - from: out/autoupdate/autoupdate-shared.js
    to: autoupdate/autoupdate-shared.js
  - from: build/icones/servidor.ico
    to: servidor.ico
  - from: src/panel-servidor
    to: servidor-panel
win:
  icon: build/icones/sistema.png
  signExecutable: false
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  artifactName: NossoSistema-Setup.exe
  include: build/installer.nsh