appId: br.com.lojatabacaria.setup
productName: NossoSistema
directories:
  output: dist-setup
files:
  - out/setup-launcher/**/*
  - package.json
extraResources:
  - from: dist-final/win-unpacked
    to: embedded/app
  - from: build/autoupdate/node.exe
    to: autoupdate/node.exe
  - from: out/autoupdate/autoupdate.js
    to: autoupdate/autoupdate.js
  - from: out/autoupdate/autoupdate-shared.js
    to: autoupdate/autoupdate-shared.js
win:
  icon: build/icones/sistema.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: NossoSistema-Setup.exe
  include: build/installer.nsh